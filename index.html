<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geografische Fakten</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            line-height: 1.6;
        }

        h1 {
            color: darkblue;
        }

        h2 {
            color: darkgreen;
        }

        img {
            border: 2px solid #555;
            margin-top: 10px;
        }

        figure {
            margin-top: 20px;
        }
    </style>
</head>

<body style="background-color: lightblue;">

    <!-- Überschrift -->
    <h1>Valentin Forstner – 5R</h1>

    <!-- Unterüberschrift -->
    <h2>Geografische Fakten</h2>

    <!-- Absatz -->
    <p>
        <strong>Traumstadt:</strong> Barcelona
        <br>
        <strong>Einwohnerzahl:</strong> ca. 1,73 Millionen
    </p>

    <!-- Sehenswürdigkeiten -->
    <h2>Top 3 Sehenswürdigkeiten</h2>

    <ol>
        <li>Stephansdom</li>
        <li>Schloss Schönbrunn</li>
        <li>Prater</li>
    </ol>

    <!-- Kulinarische Spezialitäten -->
    <h2>Kulinarische Spezialitäten</h2>

    <ul id="liste-essen">
    
    </ul>
    
        
    

    <!-- Bild -->
    <h2>Visueller Eindruck</h2>
<script>
const essen = ["Leberkäse", "Schnitzel", "Linzer Torte", "Österreich"];  // 
  const liste = document.getElementById("liste-essen");
  essen.forEach(h => {
    let li = document.createElement("li");
    li.textContent = h;
    liste.appendChild(li);
  });
</script>
  <figure>
        <img 
            src="img/wahrzeichen.jpg" 
            alt="Der Nordturm des Stephansdoms in Wien"
            title="Vorgegebenes Bild"
            width="450"
        >

        <figcaption>
            Foto von 
            <a href="https://commons.wikimedia.org/wiki/User:Bwag" target="_blank">
                Bwag
            </a>
            —
            <a href="https://commons.wikimedia.org/wiki/File:Stephansdom_Nordturm_01.JPG" target="_blank">
                Stephansdom Nordturm 01.JPG
            </a>
            —
            Lizenz:
            <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank">
                CC BY-SA 3.0
            </a>
        </figcaption>
    </figure>

    <!-- JavaScript -->
    <script>
        const speisen = [
            "Wiener Schnitzel",
            "Sachertorte",
            "Apfelstrudel",
            "Österreich"
        ];

        const liste = document.getElementById("liste-essen");

        for (let i = 0; i < speisen.length; i++) {
            let eintrag = document.createElement("li");
            eintrag.textContent = speisen[i];
            liste.appendChild(eintrag);
        }
    </script>

</body>
</html>
